name: Render HyperFrames video

# Renders one project directory (e.g. videos/1documentary) end-to-end on a
# free GitHub-hosted runner and uploads the finished MP4 as a workflow
# artifact. See documentary-broll's SKILL.md "Rendering in the cloud, free"
# section for the full design and why .media/broll and
# .hyperframes/cinematic-assets are intentionally NOT committed (unbounded
# per-video size — rebuilt fresh on every run instead).
#
# This workflow calls scripts vendored into ./ci/ (a deliberate copy, not a
# symlink into ~/.claude/skills — see ci/README.md) so this repo is fully
# self-contained and does not depend on a local Claude Code install's skill
# state, which is mutable and gets silently reinstalled/reverted by
# `npx hyperframes skills update`. Re-sync ci/ from the real skill sources
# if those scripts change — see ci/README.md for exactly which files and why.
#
# Free-tier requirement: this only runs unmetered/free if this repository is
# PUBLIC. On a private repo it consumes the account's paid Actions minutes.
#
# Two ways to trigger:
#   1. Manual: Actions tab -> "Render HyperFrames video" -> Run workflow ->
#      fill in the project path (e.g. videos/1documentary).
#   2. Automatic: push a commit that adds/changes any videos/*/STORYBOARD.md.
#      STORYBOARD.md is the trigger file on purpose, not any file under
#      videos/ — it's the one file that only exists once a project has real,
#      complete per-beat data (frames built, transitions/overlays decided),
#      so pushing partial/WIP project state (e.g. just the audio file copied
#      in) never fires a doomed render. The push job below derives the
#      project path from whichever STORYBOARD.md changed and calls the same
#      render job with it.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory, relative to repo root (e.g. videos/1documentary)"
        required: true
        type: string
      normalize:
        description: "Run loudness normalization on the final render"
        required: false
        type: boolean
        default: true
  push:
    paths:
      - "videos/*/STORYBOARD.md"

jobs:
  # On a push trigger, find every STORYBOARD.md that changed in this push and
  # emit its project directory — one render job then fans out per project
  # (handles the (rare but real) case of a push touching more than one
  # video's STORYBOARD.md at once). On workflow_dispatch, just emit the
  # single manually-given project. Either way "render" below only ever sees
  # a resolved `project` value, never `github.event.inputs.project` directly.
  resolve-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.resolve.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need the previous commit to diff against on push

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "projects=[\"${{ github.event.inputs.project }}\"]" >> "$GITHUB_OUTPUT"
          else
            # --diff-filter=AM: only an ADDED or MODIFIED STORYBOARD.md
            # triggers a render — a DELETED one (a project being removed)
            # must never fan out into a render job for a path that no
            # longer exists.
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'videos/*/STORYBOARD.md')
            if [ -z "$CHANGED" ]; then
              echo "projects=[]" >> "$GITHUB_OUTPUT"
            else
              PROJECTS=$(echo "$CHANGED" | sed -E 's#^(videos/[^/]+)/STORYBOARD\.md$#\1#' | sort -u | jq -R . | jq -sc .)
              echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
            fi
          fi

  render:
    needs: resolve-projects
    if: needs.resolve-projects.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300 # GitHub's own hard cap is 360 (6h); leave headroom for artifact upload
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.resolve-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure bundled Chrome is present
        working-directory: ${{ matrix.project }}
        run: npx --yes hyperframes@0.8.17 browser ensure

      - name: hyperframes doctor (environment sanity check)
        working-directory: ${{ matrix.project }}
        run: npx --yes hyperframes@0.8.17 doctor --json

      # Caches the downloaded/processed .media/broll/ output, keyed on this
      # project's committed beat-choice JSONs (.hyperframes/broll/*.json +
      # media-choices.json) — if neither changed since a prior run of the
      # SAME commit (a "Re-run failed jobs" retry, or a fresh manual
      # dispatch that lands on unchanged project files), the ~150-asset
      # download this step would otherwise redo (the single slowest step in
      # the whole pipeline, ~15-20 min on a real 151-beat project) is
      # skipped entirely — GitHub Actions has no native "resume from the
      # failed step" (confirmed: re-running a job always restarts it from
      # its first step, not the failed one), so this cache is the real
      # mechanism that avoids repeating already-finished expensive work on
      # a retry. A genuine content change (a different chosen clip) changes
      # the hash and correctly invalidates the cache.
      - name: Cache .media/broll (skip re-download on a same-commit retry)
        uses: actions/cache@v5
        with:
          path: ${{ matrix.project }}/.media/broll
          key: broll-${{ matrix.project }}-${{ hashFiles(format('{0}/.hyperframes/broll/*.json', matrix.project), format('{0}/.hyperframes/media-choices.json', matrix.project)) }}

      - name: Rebuild broll from cached beat candidates
        working-directory: ${{ matrix.project }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # replay-media-choices.mjs / download-clip.mjs are already idempotent
        # (skip re-downloading a beat whose output file already exists — see
        # download-clip.mjs's own existsSync check), so this call is safe
        # and correct whether the cache above hit (near-instant no-op pass
        # over already-present files) or missed (does the real work, which
        # the cache step then saves for next time).
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/replay-media-choices.mjs" \
            --project . --log .hyperframes/run-log.md

      - name: Assemble index.html
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/assemble-index.mjs" \
            --storyboard ./STORYBOARD.md --hyperframes .

      - name: Heal media-start (shared-script self-heal, see SKILL.md)
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/heal-media-start.mjs" \
            --index ./index.html --audio-meta ./audio_meta.json --log .hyperframes/run-log.md

      - name: Inject transitions (documentary-broll's vendored registry, incl. whip-pan)
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/transitions.mjs" inject \
            --storyboard ./STORYBOARD.md --hyperframes . \
            --registry "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/lib/transitions.json"
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/transitions.mjs" verify \
            --storyboard ./STORYBOARD.md --index ./index.html

      - name: Regenerate always-on cinematic layers (ambience + grain)
        working-directory: ${{ matrix.project }}
        # DURATION comes from index.html's own root data-duration, NOT
        # beats.json's totalDuration — confirmed via a real render that
        # these differ (transitions overlap adjacent clips, shortening the
        # real assembled timeline vs. the raw narration-only total). See
        # SKILL.md's "Always-on cinematic layers" section for the real
        # numbers this was caught on.
        run: |
          DURATION=$(node -e "
            const html = require('fs').readFileSync('index.html', 'utf8');
            const m = html.match(/data-composition-id=\"main\"[\s\S]*?data-duration=\"([\d.]+)\"/);
            if (!m) { console.error('could not find root data-duration in index.html'); process.exit(1); }
            console.log(m[1]);
          ")
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/gen-cinematic-assets.mjs" \
            --out-dir .hyperframes/cinematic-assets --duration "$DURATION"
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/inject-cinematic-layers.mjs" \
            --index ./index.html \
            --ambience .hyperframes/cinematic-assets/ambience-bed.mp3 \
            --grain .hyperframes/cinematic-assets/grain-overlay.mp4 \
            --duration "$DURATION" --log .hyperframes/run-log.md

      - name: hyperframes check (lint gate)
        working-directory: ${{ matrix.project }}
        # --timeout raised from the 10000ms default. Real failure caught on
        # this exact project's first CI run: "check_runtime_failure:
        # Navigation timeout of 10000 ms exceeded" — the GitHub runner has
        # no hardware GPU (`browserGpuMode probe → software (WebGL
        # unavailable)`, confirmed in that run's own log), so headless
        # Chrome paints this composition (151 mounted sub-comps + the
        # grain-overlay <video> + ambience <audio>) far slower than on a
        # real GPU machine — comfortably passed locally, timed out here.
        # 60000ms (60s) leaves real headroom over what a software-rendered
        # first paint of a page this size should need.
        run: npx --yes hyperframes@0.8.17 check --timeout 60000

      - name: Render
        working-directory: ${{ matrix.project }}
        # --docker was tried and REMOVED again — a real, confirmed dead end,
        # not a guess. Reasoning at the time was "containerized ffmpeg gets
        # real resource isolation from the browser process" — that
        # assumption was WRONG: Docker containers get NO CPU isolation from
        # the host by default (no --cpus/--cpuset-cpus limit is set, and
        # nothing indicates hyperframes render --docker sets one internally)
        # — a container just shares the exact same host vCPUs as everything
        # else, confirmed via research. Proof this didn't help: the SAME
        # failure class got WORSE with --docker (ffmpeg_timeout=62 vs. 53
        # without it) — the image build was pure added time (~4 min) for
        # zero contention benefit, so it's gone.
        #
        # The actual, confirmed root cause across THREE real failures on
        # this exact 151-beat/105-video-source project is CPU contention
        # between software-rendered Chrome (no GPU on this runner) and
        # concurrent ffmpeg extraction workers on a 4-vCPU box:
        #   1. --workers auto  -> VIDEO_SOURCE_UNRENDERABLE (10+6 failures)
        #   2. --workers 3, no --docker -> VIDEO_EXTRACTION_FAILED (53 timeouts)
        #   3. --workers 2, --docker -> VIDEO_EXTRACTION_FAILED (62 timeouts, WORSE)
        # --workers 1 serializes ffmpeg extraction entirely — no concurrent
        # ffmpeg processes to compete with Chrome or each other. Slower
        # wall-clock, but this directly addresses the confirmed cause
        # instead of another mode switch on faith. --no-browser-gpu is
        # explicit again now that --docker (which defaulted it) is gone.
        #
        # --browser-timeout kept at 180s (raised from the 60s default) — the
        # `check` step's earlier navigation-timeout failure showed
        # software-rendered Chrome painting this composition slower than a
        # real GPU machine; the same reasoning applies to render's own
        # browser navigation.
        run: |
          mkdir -p renders
          npx --yes hyperframes@0.8.17 render --skill=documentary-broll --no-browser-gpu --workers 1 --browser-timeout 180 --quality high --output renders/video.mp4

      - name: Normalize loudness
        # On workflow_dispatch, respect the explicit input. On push (no
        # `inputs` exist at all on that event — github.event.inputs.normalize
        # is empty, not "false"), default ON, matching documentary-broll's
        # own run-shape default ("Recommended: on" — see SKILL.md). Caught
        # as a real bug: the naive `== 'true'` check silently skipped
        # normalization on every auto-triggered push render.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.normalize == 'true' }}
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/normalize-mix.mjs" \
            --in renders/video.mp4 --out renders/video.mp4 --log .hyperframes/run-log.md

      - name: Compute a slash-free artifact name
        id: artifact_name
        run: echo "slug=$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ steps.artifact_name.outputs.slug }}-${{ github.run_number }}
          path: ${{ matrix.project }}/renders/video.mp4
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-log-${{ steps.artifact_name.outputs.slug }}-${{ github.run_number }}
          path: ${{ matrix.project }}/.hyperframes/run-log.md
          retention-days: 14
          if-no-files-found: ignore
