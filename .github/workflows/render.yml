name: Render HyperFrames video

# Renders one project directory (e.g. videos/1documentary) end-to-end on a
# free GitHub-hosted runner and uploads the finished MP4 as a workflow
# artifact. See documentary-broll's SKILL.md "Rendering in the cloud, free"
# section for the full design and why .media/broll and
# .hyperframes/cinematic-assets are intentionally NOT committed (unbounded
# per-video size — rebuilt fresh on every run instead).
#
# This workflow calls scripts vendored into ./ci/ (a deliberate copy, not a
# symlink into ~/.claude/skills — see ci/README.md) so this repo is fully
# self-contained and does not depend on a local Claude Code install's skill
# state, which is mutable and gets silently reinstalled/reverted by
# `npx hyperframes skills update`. Re-sync ci/ from the real skill sources
# if those scripts change — see ci/README.md for exactly which files and why.
#
# Free-tier requirement: this only runs unmetered/free if this repository is
# PUBLIC. On a private repo it consumes the account's paid Actions minutes.
#
# Two ways to trigger:
#   1. Manual: Actions tab -> "Render HyperFrames video" -> Run workflow ->
#      fill in the project path (e.g. videos/1documentary).
#   2. Automatic: push a commit that adds/changes any videos/*/STORYBOARD.md.
#      STORYBOARD.md is the trigger file on purpose, not any file under
#      videos/ — it's the one file that only exists once a project has real,
#      complete per-beat data (frames built, transitions/overlays decided),
#      so pushing partial/WIP project state (e.g. just the audio file copied
#      in) never fires a doomed render. The push job below derives the
#      project path from whichever STORYBOARD.md changed and calls the same
#      render job with it.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory, relative to repo root (e.g. videos/1documentary)"
        required: true
        type: string
      normalize:
        description: "Run loudness normalization on the final render"
        required: false
        type: boolean
        default: true
  push:
    paths:
      - "videos/*/STORYBOARD.md"

jobs:
  # On a push trigger, find every STORYBOARD.md that changed in this push and
  # emit its project directory — one render job then fans out per project
  # (handles the (rare but real) case of a push touching more than one
  # video's STORYBOARD.md at once). On workflow_dispatch, just emit the
  # single manually-given project. Either way "render" below only ever sees
  # a resolved `project` value, never `github.event.inputs.project` directly.
  resolve-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.resolve.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need the previous commit to diff against on push

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "projects=[\"${{ github.event.inputs.project }}\"]" >> "$GITHUB_OUTPUT"
          else
            # --diff-filter=AM: only an ADDED or MODIFIED STORYBOARD.md
            # triggers a render — a DELETED one (a project being removed)
            # must never fan out into a render job for a path that no
            # longer exists.
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'videos/*/STORYBOARD.md')
            if [ -z "$CHANGED" ]; then
              echo "projects=[]" >> "$GITHUB_OUTPUT"
            else
              PROJECTS=$(echo "$CHANGED" | sed -E 's#^(videos/[^/]+)/STORYBOARD\.md$#\1#' | sort -u | jq -R . | jq -sc .)
              echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
            fi
          fi

  render:
    needs: resolve-projects
    if: needs.resolve-projects.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300 # GitHub's own hard cap is 360 (6h); leave headroom for artifact upload
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.resolve-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure bundled Chrome is present
        working-directory: ${{ matrix.project }}
        run: npx --yes hyperframes@0.8.17 browser ensure

      - name: hyperframes doctor (environment sanity check)
        working-directory: ${{ matrix.project }}
        run: npx --yes hyperframes@0.8.17 doctor --json

      # Caches the downloaded/processed .media/broll/ output, keyed on this
      # project's committed beat-choice JSONs (.hyperframes/broll/*.json +
      # media-choices.json) — if neither changed since a prior run of the
      # SAME commit (a "Re-run failed jobs" retry, or a fresh manual
      # dispatch that lands on unchanged project files), the ~150-asset
      # download this step would otherwise redo (the single slowest step in
      # the whole pipeline, ~15-20 min on a real 151-beat project) is
      # skipped entirely — GitHub Actions has no native "resume from the
      # failed step" (confirmed: re-running a job always restarts it from
      # its first step, not the failed one), so this cache is the real
      # mechanism that avoids repeating already-finished expensive work on
      # a retry. A genuine content change (a different chosen clip) changes
      # the hash and correctly invalidates the cache.
      - name: Cache .media/broll (skip re-download on a same-commit retry)
        uses: actions/cache@v5
        with:
          path: ${{ matrix.project }}/.media/broll
          # v2: bumped after a real cache-staleness bug — download-clip.mjs's
          # own ffmpeg encode settings changed (added -g/-keyint_min to fix
          # the actual root cause behind 3 failed render attempts, see that
          # script's own comment), but the cache key was only ever a hash of
          # the beat-CHOICE json files, never anything encode-setting-
          # related, so a prior cache hit would have kept silently serving
          # the OLD sparse-keyframe .mp4 files with no way to detect the fix
          # had shipped. Bump this prefix again in the same way for any
          # future change to download-clip.mjs's own ffmpeg args.
          key: broll-v2-${{ matrix.project }}-${{ hashFiles(format('{0}/.hyperframes/broll/*.json', matrix.project), format('{0}/.hyperframes/media-choices.json', matrix.project)) }}

      # Fast (sub-second, no network) sanity check run BEFORE the expensive
      # broll rebuild below. Catches the exact failure class that once burned
      # a full ~7min CI run: a beat that exists in STORYBOARD.md /
      # .hyperframes/broll/*.json (e.g. a hand-built synthetic cold-open
      # frame) but was never registered in .hyperframes/beats.json —
      # replay-media-choices.mjs rejects an orphaned cache file and aborts
      # the whole job, but only AFTER downloading every other beat's footage
      # first. This step fails in seconds instead, with a message naming the
      # exact beat and the exact fix. This should already have been run and
      # passed locally before the push that triggered this workflow (see
      # documentary-broll's SKILL.md "Mandatory pre-push gate") — this is a
      # backstop for the case that check was skipped, not the primary gate.
      - name: Verify beats.json / STORYBOARD.md / broll cache are consistent
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/verify-ci-parity.mjs" \
            --beats .hyperframes/beats.json --storyboard STORYBOARD.md \
            --broll-dir .hyperframes/broll --scene-choices .hyperframes/scene-choices.json \
            --log .hyperframes/run-log.md

      - name: Rebuild broll from cached beat candidates
        working-directory: ${{ matrix.project }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # replay-media-choices.mjs / download-clip.mjs are already idempotent
        # (skip re-downloading a beat whose output file already exists — see
        # download-clip.mjs's own existsSync check), so this call is safe
        # and correct whether the cache above hit (near-instant no-op pass
        # over already-present files) or missed (does the real work, which
        # the cache step then saves for next time).
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/replay-media-choices.mjs" \
            --project . --log .hyperframes/run-log.md

      - name: Assemble index.html
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/assemble-index.mjs" \
            --storyboard ./STORYBOARD.md --hyperframes .

      - name: Heal media-start (shared-script self-heal, see SKILL.md)
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/heal-media-start.mjs" \
            --index ./index.html --audio-meta ./audio_meta.json --log .hyperframes/run-log.md

      - name: Inject transitions (documentary-broll's vendored registry, incl. whip-pan)
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/transitions.mjs" inject \
            --storyboard ./STORYBOARD.md --hyperframes . \
            --registry "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/lib/transitions.json"
          node "$GITHUB_WORKSPACE/ci/faceless-explainer/scripts/transitions.mjs" verify \
            --storyboard ./STORYBOARD.md --index ./index.html

      - name: Regenerate always-on cinematic layers (ambience + grain)
        working-directory: ${{ matrix.project }}
        # DURATION comes from index.html's own root data-duration, NOT
        # beats.json's totalDuration — confirmed via a real render that
        # these differ (transitions overlap adjacent clips, shortening the
        # real assembled timeline vs. the raw narration-only total). See
        # SKILL.md's "Always-on cinematic layers" section for the real
        # numbers this was caught on.
        #
        # --no-grain: real, MEASURED finding, not a guess — a local A/B test
        # on a video-heavy composition (matching this skill's actual shape:
        # multiple <video> broll sources + the grain <video> layer) showed
        # the grain overlay's mix-blend-mode:overlay compositing makes
        # per-frame capture ~2.6x slower. hyperframes render's fast
        # page-side-compositing path is already disabled by the plain
        # presence of <video> content in this composition (documented:
        # "HDR/alpha/video content auto-disables" it) — --sdr does NOT help
        # here (confirmed: hasHdrContent was false the whole time, HDR was
        # never the actual blocker). Skipping ONLY the grain layer (ambience
        # bed stays on — it's audio-only, zero compositing cost) is the
        # single biggest available lever on a long/many-beat render without
        # lowering --quality. Revisit once a cheaper grain implementation
        # (e.g. baked into the ffmpeg encode instead of a blended DOM layer)
        # is built and tested — see SKILL.md.
        run: |
          DURATION=$(node -e "
            const html = require('fs').readFileSync('index.html', 'utf8');
            const m = html.match(/data-composition-id=\"main\"[\s\S]*?data-duration=\"([\d.]+)\"/);
            if (!m) { console.error('could not find root data-duration in index.html'); process.exit(1); }
            console.log(m[1]);
          ")
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/gen-cinematic-assets.mjs" \
            --out-dir .hyperframes/cinematic-assets --duration "$DURATION"
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/inject-cinematic-layers.mjs" \
            --index ./index.html \
            --ambience .hyperframes/cinematic-assets/ambience-bed.mp3 \
            --no-grain \
            --duration "$DURATION" --log .hyperframes/run-log.md

      - name: hyperframes check (lint gate)
        working-directory: ${{ matrix.project }}
        # --timeout raised from the 10000ms default. Real failure caught on
        # this exact project's first CI run: "check_runtime_failure:
        # Navigation timeout of 10000 ms exceeded" — the GitHub runner has
        # no hardware GPU (`browserGpuMode probe → software (WebGL
        # unavailable)`, confirmed in that run's own log), so headless
        # Chrome paints this composition (151 mounted sub-comps + the
        # grain-overlay <video> + ambience <audio>) far slower than on a
        # real GPU machine — comfortably passed locally, timed out here.
        # 60000ms (60s) leaves real headroom over what a software-rendered
        # first paint of a page this size should need.
        run: npx --yes hyperframes@0.8.17 check --timeout 60000

      - name: Render
        working-directory: ${{ matrix.project }}
        # Flags below are the settled end state of a real debugging chain —
        # worth knowing why each exists before touching them again:
        #   1. --workers auto  -> VIDEO_SOURCE_UNRENDERABLE (10+6 failures) —
        #      looked like CPU contention between Chrome + concurrent ffmpeg.
        #   2. --workers 3, no --docker -> VIDEO_EXTRACTION_FAILED (53 timeouts)
        #   3. --workers 2, --docker -> VIDEO_EXTRACTION_FAILED (62, WORSE) —
        #      root-caused: Docker gives NO CPU isolation by default, so
        #      --docker was pure added build time for zero benefit. Removed.
        #   4. --workers 1 (fully serial, zero concurrency possible) STILL
        #      failed (54 timeouts) — this is what ruled out CPU contention
        #      as the cause entirely, and forced reading the render log's
        #      OWN compiler warnings instead of guessing another flag.
        #   5. Found the REAL bug there: "sparse keyframes ... causes seek
        #      failures and frame freezing" on ~half the video sources —
        #      download-clip.mjs's own ffmpeg encode never set -g/-keyint_min.
        #      Fixed in download-clip.mjs (see that file). Failures dropped
        #      54 -> 35, zero sparse-keyframe warnings after.
        #   6. The 35 remaining timeouts lined up with the extraction stage's
        #      own elapsedMs exceeding the 300000ms/5min default
        #      --protocol-timeout — raised to 900000 (15 min).
        #   7. --workers 1 was kept through all of the above because more
        #      workers caused VIDEO_EXTRACTION_FAILED BEFORE the sparse-
        #      keyframe fix landed — concurrent ffmpeg seeks choking on
        #      already-slow sparse-GOP files looked like contention. That
        #      root cause is fixed now (step 5), so the reasoning for
        #      --workers 1 no longer holds.
        #   8. Separately, a real full-project CI run showed the actual
        #      dominant slowness was NOT the grain overlay (--no-grain below
        #      is still a real, smaller win) but one Pexels source clip
        #      carrying stray BT.2020/HLG container color tags that ffmpeg
        #      passed through on re-encode uncorrected. hyperframes render
        #      trusts that container tag at probe time, not the actual pixel
        #      data (already 8-bit yuv420p) — one mistagged clip flipped
        #      nativeHdrVideoCount>0 for the WHOLE composition and forced
        #      every frame onto the ~2.4s/frame HDR layered-composite path
        #      (confirmed via log: effectiveHdr:hlg, ~18h projected). Fixed
        #      in download-clip.mjs by stamping -color_primaries/-color_trc/
        #      -colorspace bt709 on every re-encode, verified locally against
        #      a synthetic HDR-tagged source.
        #   9. With both real bottlenecks (sparse keyframes, stray HDR tags)
        #      fixed, --workers 4 was re-tried (matches GitHub-hosted
        #      runners' 4 cores) — needed for future 30-min daily videos
        #      (~2x this project's frame count) to have any realistic chance
        #      of finishing inside the 300-min job cap.
        #  10. --workers 10 tested deliberately (craft-upgrade-pass1 branch,
        #      run 33293684916, 2026-08-30) specifically to see whether the
        #      added craft-upgrade code + a real runner's 4-core ceiling
        #      would combine to fail the same way steps 1-4's CPU-contention
        #      class did. It did NOT: 27,315/27,315 frames captured with
        #      ZERO errors, succeeded on attempt 1/3 (no retry needed),
        #      steady non-degrading throughput the whole way (~455
        #      frames/min, no slowdown/timeout pattern), only one benign
        #      pre-existing warning (a 0.3s narration-slot rounding on the
        #      final beat, auto-corrected by the engine, unrelated to
        #      worker count). Real evidence, not a guess, that the
        #      sparse-keyframe/HDR-tag fixes (steps 5+8) — not the worker
        #      count itself — were the actual cause of the original
        #      contention failures; with those fixed, 10 workers is
        #      genuinely faster with no downside observed. KEPT at 10 based
        #      on this one clean run. If a FUTURE run at 10 shows the
        #      contention symptoms from steps 1-4 again (timeouts,
        #      VIDEO_EXTRACTION_FAILED), that's real evidence this decision
        #      needs revisiting — don't assume this one success generalizes
        #      forever without re-checking if trouble resurfaces.
        #
        # Retry the render command itself up to 3 times regardless — GitHub's
        # shared runner has genuine run-to-run CPU/disk throughput variance
        # (the render tool's own failure payload says `"retryable": true`
        # for exactly this reason), so a run that hits a slow stretch of I/O
        # has a real chance of not hitting it again on a fresh attempt.
        # 11. --low-memory-mode added after a real 13-minute/145-beat film
        #     (videos/altair-doc) killed the runner outright: exit code 143,
        #     "The runner has received a shutdown signal", immediately after
        #     all 167 videos extracted. Root cause is NOT concurrency and not
        #     the sparse-keyframe class above — it is disk. Default capture
        #     stages uncompressed frames to disk; that film asked for ~190 GB
        #     of temporary frame storage (measured locally, where it failed
        #     the same way with a clear message) and a GitHub-hosted runner
        #     has only ~14.2 GB available. Shorter films fit and is why this
        #     went unnoticed until now. --low-memory-mode streams frames to
        #     the encoder instead of staging them, which is the documented fix
        #     and removes the disk ceiling entirely.
        run: |
          mkdir -p renders
          df -h / | tail -1   # keep runner disk visible in the log
          for attempt in 1 2 3; do
            echo "::group::Render attempt $attempt/3"
            if npx --yes hyperframes@0.8.17 render --skill=documentary-broll --no-browser-gpu --workers 10 --browser-timeout 180 --protocol-timeout 900000 --quality high --low-memory-mode --output renders/video.mp4; then
              echo "::endgroup::"
              echo "Render succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "Render attempt $attempt failed"
            rm -f renders/video.mp4
          done
          echo "All 3 render attempts failed"
          exit 1

      - name: Normalize loudness
        # On workflow_dispatch, respect the explicit input. On push (no
        # `inputs` exist at all on that event — github.event.inputs.normalize
        # is empty, not "false"), default ON, matching documentary-broll's
        # own run-shape default ("Recommended: on" — see SKILL.md). Caught
        # as a real bug: the naive `== 'true'` check silently skipped
        # normalization on every auto-triggered push render.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.normalize == 'true' }}
        working-directory: ${{ matrix.project }}
        run: |
          node "$GITHUB_WORKSPACE/ci/documentary-broll/scripts/normalize-mix.mjs" \
            --in renders/video.mp4 --out renders/video.mp4 --log .hyperframes/run-log.md

      - name: Compute a slash-free artifact name
        id: artifact_name
        run: echo "slug=$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # retention-days lowered from 14 -> 3 (real fix, requested after a real
      # storage-accumulation concern: 2 already-uploaded render artifacts
      # totaled ~3.6GB on their own, one per active-testing run, plus a
      # real 3GB .media/broll cache — during active development/testing,
      # a finished video is downloaded and reviewed promptly, not archived
      # for 2 weeks; 3 days is real headroom without the same accumulation
      # risk. See the scheduled cleanup workflow (cleanup.yml) for the
      # complementary periodic sweep of anything that still slips past
      # this window.
      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ steps.artifact_name.outputs.slug }}-${{ github.run_number }}
          path: ${{ matrix.project }}/renders/video.mp4
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-log-${{ steps.artifact_name.outputs.slug }}-${{ github.run_number }}
          path: ${{ matrix.project }}/.hyperframes/run-log.md
          retention-days: 3
          if-no-files-found: ignore
