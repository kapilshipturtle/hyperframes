  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (function () {
      var ticksEl = document.getElementById('beat123-ticks');
      // build ruler tick marks (16 minor ticks, majors every 4th)
      var tickCount = 16;
      for (var i = 0; i < tickCount; i++) {
        var t = document.createElement('div');
        t.className = 'beat123-tick' + (i % 4 === 0 ? ' major' : '');
        t.style.bottom = (i * (200 / tickCount)) + 'px';
        ticksEl.appendChild(t);
      }

      var tl = gsap.timeline({ paused: true });
      var numEl = document.getElementById('beat123-num');
      var counter = { v: 0 };

      // Flow line draws in first, establishing the ground plane (0 - 18%)
      tl.to('#beat123-flowline', {
        width: 1080,
        duration: 0.72,
        ease: 'power2.out'
      }, 0);

      // Ruler rises into place (12% - 42%)
      tl.to('#beat123-ruler', {
        height: 200,
        duration: 0.9,
        ease: 'power2.out'
      }, 0.48);
      gsap.set('#beat123-cap', { xPercent: -50, y: 0 });
      tl.to('#beat123-cap', {
        opacity: 1,
        y: -200,
        duration: 0.5,
        ease: 'power2.out'
      }, 0.55);

      // Water fills to the two-inch mark, starting ~38% into duration
      tl.to('#beat123-water', {
        height: 40,
        duration: 1.1,
        ease: 'power2.inOut'
      }, 1.55);

      // Number count-up starts ~45% in, synced with water rising
      tl.to(counter, {
        v: 2,
        duration: 1.0,
        ease: 'power1.inOut',
        onUpdate: function () {
          numEl.innerHTML = counter.v.toFixed(1).replace(/\.0$/, '') + '<span class="beat123-accent">"</span>';
        },
        onComplete: function () {
          numEl.innerHTML = '2<span class="beat123-accent">"</span>';
        }
      }, 1.75);

      tl.to('#beat123-label', {
        opacity: 1,
        duration: 0.5,
        ease: 'power1.out'
      }, 1.75);

      // Caption settles last, quietly
      tl.to('#beat123-caption', {
        opacity: 0.7,
        duration: 0.5,
        ease: 'power1.out'
      }, 2.9);

      window.__timelines = window.__timelines || {};
      window.__timelines['123-beat'] = tl;
    })();
