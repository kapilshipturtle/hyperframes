  <script>
    (function () {

      var grid = document.getElementById("beat137-grid");
      var TOTAL = 60;
      var dots = [];
      for (var i = 0; i < TOTAL; i++) {
        var d = document.createElement("div");
        d.className = "beat137-dot";
        grid.appendChild(d);
        dots.push(d);

      // Deterministic "knock down" selection: every 3rd-ish dot in a fixed

      // set of survivors regardless of position/sex-coding.

      var hitSet = {};
      for (var h = 0; h < hitIdx.length; h++) hitSet[hitIdx[h]] = true;

      // Survivor highlight subset: a handful spread across the remaining
      // dots to represent "the survivors" regardless of original sex ratio.
      var survivorIdx = [0,2,10,18,26,38,46,54,58];
      var survivorSet = {};
      for (var s = 0; s < survivorIdx.length; s++) survivorSet[survivorIdx[s]] = true;

      gsap.set(dots, { scale: 1, opacity: 0, y: 0 });
      gsap.set("#beat137-label", { opacity: 0, y: -10 });
      gsap.set("#beat137-caption", { opacity: 0, y: 10 });

      var tl = gsap.timeline({ paused: true });

      // 0 - population assembles quietly first (establishing shot)

      // ~35-55% into duration: the "knock down" control effort hits
      var hitStart = 3.4;
      var hitDots = [];
      for (var a = 0; a < hitIdx.length; a++) hitDots.push(dots[hitIdx[a]]);
      tl.to(hitDots, {
        backgroundColor: "#3a3d44",
        opacity: 0.32,
        scale: 0.82,
        duration: 0.5,
        ease: "power3.in",
        stagger: { each: 0.02, from: "random" }
      }, hitStart);

      // brief settle / disruption beat — population balance visibly broken
      tl.to("#beat137-label", { opacity: 0, duration: 0.4, ease: "power1.out" }, hitStart + 0.7);

      // ~65-80%: survivors highlighted — regardless of composition, they remain able to reproduce
      var survivorStart = 6.2;
      var survivorDots = [];
      for (var b = 0; b < survivorIdx.length; b++) survivorDots.push(dots[survivorIdx[b]]);
      tl.to(survivorDots, {

        scale: 1.18,
        duration: 0.5,
        ease: "power2.out",
        stagger: { each: 0.05 }
      }, survivorStart);
      tl.to(survivorDots, {
        scale: 1.0,
        duration: 0.4,
        ease: "power2.inOut"
      }, survivorStart + 0.6);

      tl.to("#beat137-caption", { opacity: 0.85, y: 0, duration: 0.6, ease: "power2.out" }, 7.3);

      window.__timelines["137-beat"] = tl;
