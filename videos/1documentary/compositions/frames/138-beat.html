          dots.push(d);
        });

      }

      var leftDots = buildDots("beat138-dots-left", "beat138-l");
      var rightDots = buildDots("beat138-dots-right", "beat138-r");

      // X mark overlay for the left (fixed-sex) column, shown once the

      gsap.set(["#beat138-label-left", "#beat138-label-right"], { y: -14 });
