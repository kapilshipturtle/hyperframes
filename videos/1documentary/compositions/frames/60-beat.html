      var days = root.querySelectorAll('.bt60-day');

      var tl = gsap.timeline({ paused: true });

      // Card + eyebrow settle in early

        duration: 0.6,
        ease: 'power2.out'

      tl.set(strip, { opacity: 0 }, 0);
      tl.to(strip, { opacity: 1, duration: 0.3 }, 2.4);

      var tickStart = 2.6;
      var tickSpan = 2.7;
      var step = tickSpan / days.length;
      days.forEach(function (day, i) {

          borderColor: '#a9b4c0',
