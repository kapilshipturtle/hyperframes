      var tl = gsap.timeline({ paused: true });

      var trackTop = 168;
      var trackHeight = 700;

      // map 0-100% onto the track (0% at bottom, 100% at top)

      var lo = { v: 0 };
      var hi = { v: 0 };
      var loEl = document.getElementById("f76-num-lo");
