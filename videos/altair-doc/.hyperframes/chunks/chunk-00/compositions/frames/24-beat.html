<template>
  <style>
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }
    .f-24-beat-bg {
      position: absolute;
      inset: 0;
      background: #0d0d0f;
    }
    .f-24-beat-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .f-24-beat-grid {
      display: grid;
      grid-template-columns: repeat(7, 168px);
      grid-auto-rows: 168px;
      gap: 22px;
    }
    .f-24-beat-tile {
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.035);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 300 62px/1 -apple-system, "Inter", sans-serif;
      color: #f2f2f0;
      opacity: 0;
    }
    .f-24-beat-strike {
      position: absolute;
      left: 22px;
      top: 50%;
      width: 124px;
      height: 3px;
      background: #a9b4c0;
      transform: scaleX(0);
      transform-origin: left center;
    }
    .f-24-beat-tile.f-24-beat-killed {
      color: #a9b4c0;
    }
    .f-24-beat-tally {
      margin-top: 54px;
      font: 400 34px/1 -apple-system, "Inter", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(242, 242, 240, 0.78);
      opacity: 0;
    }
    .f-24-beat-tally b {
      font-weight: 600;
      color: #a9b4c0;
    }
  </style>

  <div
    id="root"
    data-composition-id="24-beat"
    data-width="1920" data-height="1080" data-duration="2.36"
  >
    <div class="f-24-beat-bg clip" data-start="0" data-duration="2.36" data-track-index="0"></div>
    <div class="f-24-beat-stage clip" id="f-24-beat-stage" data-start="0" data-duration="2.36" data-track-index="1">
      <div class="f-24-beat-grid" id="f-24-beat-grid"></div>
      <div class="f-24-beat-tally" id="f-24-beat-tally"><b id="f-24-beat-count">0</b> YOU CAN KILL</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var grid = document.getElementById("f-24-beat-grid");
      var tiles = [];
      var strikes = [];
      for (var i = 0; i < 14; i++) {
        var n = 14 - i;
        var tile = document.createElement("div");
        tile.className = "f-24-beat-tile";
        var label = document.createElement("span");
        label.textContent = String(n);
        var strike = document.createElement("i");
        strike.className = "f-24-beat-strike";
        tile.appendChild(label);
        tile.appendChild(strike);
        grid.appendChild(tile);
        tiles.push(tile);
        strikes.push(strike);
      }

      // the six lowest-numbered tiles (6..1) are the ones that get killed
      var killOrder = [8, 9, 10, 11, 12, 13];

      var tl = gsap.timeline({ paused: true });

      tl.to(tiles, { opacity: 1, duration: 0.30, stagger: 0.018, ease: "power2.out" }, 0.02);

      var killStart = 0.72;
      var step = 0.13;
      for (var k = 0; k < killOrder.length; k++) {
        var t = killStart + k * step;
        var tgt = tiles[killOrder[k]];
        tl.to(strikes[killOrder[k]], { scaleX: 1, duration: 0.16, ease: "power2.out" }, t);
        tl.to(tgt, { opacity: 0.42, borderColor: "rgba(169,180,192,0.55)", duration: 0.20, ease: "power1.out" }, t);
        tl.set(tgt, { className: "f-24-beat-tile f-24-beat-killed" }, t);
      }

      var counter = { v: 0 };
      var countEl = document.getElementById("f-24-beat-count");
      tl.to(document.getElementById("f-24-beat-tally"), { opacity: 1, duration: 0.24, ease: "power1.out" }, killStart - 0.06);
      tl.to(counter, {
        v: 6,
        duration: killOrder.length * step,
        ease: "none",
        onUpdate: function () {
          countEl.textContent = String(Math.round(counter.v));
        }
      }, killStart);
      tl.set(countEl, { innerText: "6" }, killStart + killOrder.length * step);

      window.__timelines["24-beat"] = tl;
    })();
  </script>
</template>
