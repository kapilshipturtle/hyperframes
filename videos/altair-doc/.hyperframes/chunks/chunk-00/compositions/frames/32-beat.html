<template>
  <style>
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: -apple-system, "Inter", "Helvetica Neue", sans-serif;
    }
    .f32-bg {
      position: absolute;
      inset: 0;
      background: #0c0c0e;
    }
    .f32-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 900px 520px at 50% 42%, rgba(224,104,90,0.10) 0%, rgba(224,104,90,0) 70%);
      pointer-events: none;
      opacity: 0;
    }
    .f32-stack {
      position: absolute;
      left: 0;
      top: 118px;
      width: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .f32-row { display: flex; flex-direction: column; align-items: center; }
    .f32-label {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f2f2f0;
      opacity: 0;
    }
    .f32-num {
      font-size: 168px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      opacity: 0;
    }
    .f32-num-accent { color: #e0685a; }
    .f32-rule {
      width: 0px;
      height: 2px;
      background: #e0685a;
      opacity: 0.75;
      margin: 26px 0 30px 0;
    }
    .f32-sub {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f2f2f0;
      opacity: 0;
    }
  </style>

  <div
    id="root"
    data-composition-id="32-beat"
    data-width="1920" data-height="1080" data-duration="7.73"
  >
    <div class="f32-bg clip" data-start="0" data-duration="7.73" data-track-index="0"></div>
    <div class="f32-glow clip" id="f32-glow" data-start="0" data-duration="7.73" data-track-index="1"></div>

    <div class="f32-stack clip" data-start="0" data-duration="7.73" data-track-index="2">
      <div class="f32-row">
        <div class="f32-label" id="f32-label-a">In refunds</div>
        <div class="f32-num f32-num-accent" id="f32-num-a">$0</div>
      </div>
      <div class="f32-rule" id="f32-rule"></div>
      <div class="f32-row">
        <div class="f32-num" id="f32-num-b">0</div>
        <div class="f32-label" id="f32-label-b">Households</div>
      </div>
      <div class="f32-sub" id="f32-sub">Nine companies &middot; one state &middot; this April</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var glow = document.getElementById("f32-glow");
      var labelA = document.getElementById("f32-label-a");
      var numA = document.getElementById("f32-num-a");
      var rule = document.getElementById("f32-rule");
      var numB = document.getElementById("f32-num-b");
      var labelB = document.getElementById("f32-label-b");
      var sub = document.getElementById("f32-sub");

      gsap.set([labelA, numA, numB, labelB, sub], { opacity: 0, y: 22 });
      gsap.set(rule, { width: 0 });
      gsap.set(glow, { opacity: 0 });

      var countA = { v: 0 };
      var countB = { v: 0 };

      function money(n) {
        return "$" + Math.round(n).toLocaleString("en-US");
      }
      function plain(n) {
        return Math.round(n).toLocaleString("en-US");
      }

      // 0.0-0.9 : first label settles in
      tl.to(labelA, { opacity: 0.82, y: 0, duration: 0.7, ease: "power2.out" }, 0.25);
      tl.to(glow, { opacity: 1, duration: 1.6, ease: "power1.out" }, 0.25);

      // 0.9-2.9 : the money number arrives and counts up
      tl.to(numA, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.95);
      tl.to(countA, {
        v: 50000000,
        duration: 1.75,
        ease: "power2.out",
        onUpdate: function () { numA.textContent = money(countA.v); }
      }, 1.05);

      // 2.9-3.5 : hairline draws between the two figures
      tl.to(rule, { width: 420, duration: 0.65, ease: "power2.inOut" }, 2.95);

      // 3.5-5.6 : households number arrives and counts up
      tl.to(numB, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.55);
      tl.to(countB, {
        v: 278000,
        duration: 1.6,
        ease: "power2.out",
        onUpdate: function () { numB.textContent = plain(countB.v); }
      }, 3.65);
      tl.to(labelB, { opacity: 0.82, y: 0, duration: 0.6, ease: "power2.out" }, 4.55);

      // 5.9-6.7 : subordinate attribution line
      tl.to(sub, { opacity: 0.7, y: 0, duration: 0.7, ease: "power2.out" }, 5.95);

      window.__timelines["32-beat"] = tl;
    })();
  </script>
