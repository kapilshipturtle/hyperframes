<template>
  <style>
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }
    .f39-bg {
      position: absolute;
      inset: 0;
      background: #0c0c0e;
    }
    .f39-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .f39-months {
      display: grid;
      grid-template-columns: repeat(12, 92px);
      gap: 18px;
    }
    .f39-cell {
      width: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .f39-amt {
      font: 600 26px/1 -apple-system, "Inter", sans-serif;
      color: #a9b4c0;
      letter-spacing: 0.01em;
      opacity: 0;
    }
    .f39-tick {
      width: 92px;
      height: 4px;
      background: #a9b4c0;
      transform-origin: left center;
      transform: scaleX(0);
      opacity: 0.85;
    }
    .f39-mo {
      font: 500 18px/1 -apple-system, "Inter", sans-serif;
      color: #f2f2f0;
      opacity: 0.42;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .f39-total {
      margin-top: 86px;
      font: 800 170px/1 -apple-system, "Inter", sans-serif;
      color: #ffffff;
      letter-spacing: -0.03em;
      opacity: 0;
    }
    .f39-total-label {
      margin-top: 20px;
      font: 600 24px/1 -apple-system, "Inter", sans-serif;
      color: #f2f2f0;
      opacity: 0;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }
  </style>

  <div
    id="root"
    data-composition-id="39-beat"
    data-width="1920" data-height="1080" data-duration="1.95"
  >
    <div class="f39-bg clip" data-start="0" data-duration="1.95" data-track-index="0"></div>

    <div class="f39-stage clip" data-start="0" data-duration="1.95" data-track-index="1">
      <div class="f39-months" id="f39-months"></div>
      <div class="f39-total" id="f39-total">$0</div>
      <div class="f39-total-label" id="f39-total-label">A Year</div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var MONTHS = ["J","F","M","A","M","J","J","A","S","O","N","D"];
      var wrap = document.getElementById("f39-months");
      var amts = [], ticks = [];
      for (var i = 0; i < 12; i++) {
        var cell = document.createElement("div");
        cell.className = "f39-cell";
        var amt = document.createElement("div");
        amt.className = "f39-amt";
        amt.textContent = "$3";
        var tick = document.createElement("div");
        tick.className = "f39-tick";
        var mo = document.createElement("div");
        mo.className = "f39-mo";
        mo.textContent = MONTHS[i];
        cell.appendChild(amt);
        cell.appendChild(tick);
        cell.appendChild(mo);
        wrap.appendChild(cell);
        amts.push(amt);
        ticks.push(tick);
      }

      var total = document.getElementById("f39-total");
      var totalLabel = document.getElementById("f39-total-label");
      var counter = { v: 0 };

      var tl = gsap.timeline({ paused: true });

      // months tick across 0.00 -> 0.72
      tl.to(amts, { opacity: 1, duration: 0.14, stagger: 0.055, ease: "none" }, 0);
      tl.to(ticks, { scaleX: 1, duration: 0.16, stagger: 0.055, ease: "power2.out" }, 0.02);

      // total draws in as the line lands
      tl.to(total, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0.78);
      tl.fromTo(total, { y: 26 }, { y: 0, duration: 0.34, ease: "power3.out" }, 0.78);
      tl.to(counter, {
        v: 36,
        duration: 0.52,
        ease: "power2.out",
        onUpdate: function () {
          total.textContent = "$" + Math.round(counter.v);
        }
      }, 0.80);
      tl.to(totalLabel, { opacity: 0.72, duration: 0.24, ease: "power2.out" }, 1.16);

      window.__timelines["39-beat"] = tl;
    })();
  </script>
</template>
