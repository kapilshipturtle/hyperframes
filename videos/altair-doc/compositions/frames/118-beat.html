  <div id="root" data-composition-id="118-beat" data-width="1920" data-height="1080" data-duration="9.19">

    <div class="b118-bg clip" data-start="0" data-duration="9.24" data-track-index="0"></div>

    <div class="b118-eyebrow clip" id="b118-eyebrow" data-start="0" data-duration="9.24" data-track-index="1">Connecticut</div>

    <div class="b118-grid clip" id="b118-grid" data-start="0" data-duration="9.24" data-track-index="2"></div>

    <div class="b118-gridcap clip" id="b118-gridcap" data-start="0" data-duration="9.24" data-track-index="3">100 customers</div>

    <div class="b118-num clip" id="b118-num" data-start="0" data-duration="9.24" data-track-index="4"><span id="b118-numval">0</span><span class="b118-num-pct">%</span></div>

    <div class="b118-rule clip" id="b118-rule" data-start="0" data-duration="9.24" data-track-index="5"></div>

    <div class="b118-cap clip" id="b118-cap" data-start="0" data-duration="9.24" data-track-index="6">of one utility&rsquo;s third-party supply customers paid <strong>MORE</strong> than the standard rate</div>

    <div class="b118-src clip" id="b118-src" data-start="0" data-duration="9.24" data-track-index="7">Connecticut Office of Consumer Counsel</div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var DUR = 9.24;
      var COLS = 10, ROWS = 10, CELL = 58, DOT = 38;
      var LIT = 86;

      var grid = document.getElementById("b118-grid");
      var litEls = [];

      // Deterministic build: row-major, left-to-right, top-to-bottom.
      // The first 86 cells in reading order are the "lit" ones, so the
      // remaining 14 read as a clean unlit tail in the bottom-right —
      // the proportion is legible at a glance, no randomness anywhere.
      for (var i = 0; i < COLS * ROWS; i++) {
        var r = Math.floor(i / COLS), c = i % COLS;
        var x = c * CELL + (CELL - DOT) / 2;
        var y = r * CELL + (CELL - DOT) / 2;

        var base = document.createElement("div");
        base.className = "b118-dot";
        base.style.left = x + "px";
        base.style.top = y + "px";
        grid.appendChild(base);

        if (i < LIT) {
          var lit = document.createElement("div");
          lit.className = "b118-dot b118-dot-lit";
          lit.style.left = x + "px";
          lit.style.top = y + "px";
          grid.appendChild(lit);
          litEls.push(lit);
        }
      }

      var tl = gsap.timeline({ paused: true });

      // 0.0 - place
      tl.fromTo("#b118-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.15);

      // 0.7 - the empty grid arrives (outlines only), so the viewer reads
      // "100 of something" BEFORE any of it is filled in.
      tl.fromTo(grid.querySelectorAll(".b118-dot:not(.b118-dot-lit)"),
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out",
          stagger: { each: 0.006, from: "start" }, transformOrigin: "50% 50%" }, 0.7);

      tl.fromTo("#b118-gridcap",
        { opacity: 0 },
        { opacity: 0.6, duration: 0.6, ease: "power1.out" }, 1.35);

      // 1.9 -> 6.1 - the fill. Spread across ~4.2s of the 9.24s so the
      // proportion becomes visible ON narration pacing, never at t=0.
      tl.fromTo(litEls,
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power2.out",
          transformOrigin: "50% 50%",
          stagger: { each: (4.2 - 0.34) / (LIT - 1), from: "start" } }, 1.9);

      // 4.3 - the number starts resolving while the last third of the grid
      // is still filling, and lands on 86 just as the fill completes.
      var numEl = document.getElementById("b118-numval");
      tl.fromTo("#b118-num",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.3);

      // Seek-safe count-up: the renderer seeks frame-by-frame rather than
      // playing, so an onUpdate-driven counter can be skipped entirely on a
      // cold seek and freeze at its start value. Driving the text off the
      // tween's OWN progress via a render callback makes the displayed
      // number a pure function of timeline position — correct at any seek.
      var counter = { v: 0 };
      var countTween = gsap.to(counter, {
        v: 86,
        duration: 1.75,
        ease: "power2.out",
        paused: true
      });
      countTween.eventCallback("onUpdate", function () {
        numEl.textContent = Math.round(counter.v);
      });
      tl.to(countTween, {
        progress: 1,
        duration: 1.75,
        ease: "none",
        onUpdate: function () { numEl.textContent = Math.round(counter.v); }
      }, 4.35);

      // 6.2 - rule draws, caption and source settle under the number.
      tl.to("#b118-rule", { width: 600, duration: 0.8, ease: "power3.out" }, 6.2);

      tl.fromTo("#b118-cap",
        { opacity: 0, y: 16 },
        { opacity: 0.92, y: 0, duration: 0.75, ease: "power2.out" }, 6.45);

      tl.fromTo("#b118-src",
        { opacity: 0 },
        { opacity: 0.5, duration: 0.7, ease: "power1.out" }, 7.4);

      // no exit tween — the root transition handles the cut.

      window.__timelines["118-beat"] = tl;
    })();
  </script>
