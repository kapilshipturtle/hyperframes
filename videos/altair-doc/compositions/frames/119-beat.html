  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var moneyEl = document.querySelector('[data-composition-id="119-beat"] #b119-money');
      var hhEl = document.querySelector('[data-composition-id="119-beat"] #b119-hh');

      function group(n) {
        var s = String(Math.round(n));
        var out = "";
        var c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          c++;
          if (c % 3 === 0 && i > 0) out = "," + out;
        }
        return out;
      }

      var moneyCounter = { v: 0 };
      var hhCounter = { v: 0 };

      // ---- 0.0s : ground settles ----
      tl.fromTo("#b119-glow", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "sine.out" }, 0);

      // ---- 0.35s : dateline chip ----
      tl.fromTo(
        "#b119-chip",
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" },
        0.35
      );

      // ---- 1.15s : the money figure arrives, then counts (the film's biggest number) ----
      tl.fromTo(
        "#b119-money",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        1.15
      );
      // Seek-safe count-up: the renderer seeks frame-by-frame rather than
      // playing, so an onUpdate driven straight off a timeline tween can be
      // skipped entirely on a cold seek and freeze at its start value.
      // Driving the value off a nested paused tween's OWN progress makes the
      // displayed number a pure function of timeline position.
      var moneyTween = gsap.to(moneyCounter, {
        v: 50000000,
        duration: 2.3,
        ease: "power2.out",
        paused: true,
      });
      tl.to(
        moneyTween,
        {
          progress: 1,
          duration: 2.3,
          ease: "none",
          onUpdate: function () {
            if (moneyEl) moneyEl.textContent = "$" + group(moneyCounter.v);
          },
        },
        1.45
      );

      // ---- 3.75s : the figure is underlined and named ----
      tl.fromTo(
        "#b119-money-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        3.75
      );
      tl.fromTo(
        "#b119-money-label",
        { opacity: 0, y: 8 },
        { opacity: 0.72, y: 0, duration: 0.6, ease: "power2.out" },
        3.95
      );

      // ---- 4.55s : the connector drops toward the households figure ----
      tl.fromTo(
        "#b119-connector",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.8, ease: "power2.inOut" },
        4.55
      );
      tl.fromTo(
        "#b119-connector-cap",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        5.25
      );

      // ---- 5.5s : households figure arrives, then counts (second number, in sequence) ----
      tl.fromTo(
        "#b119-hh",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        5.5
      );
      var hhTween = gsap.to(hhCounter, {
        v: 278000,
        duration: 2.1,
        ease: "power2.out",
        paused: true,
      });
      tl.to(
        hhTween,
        {
          progress: 1,
          duration: 2.1,
          ease: "none",
          onUpdate: function () {
            if (hhEl) hhEl.textContent = group(hhCounter.v);
          },
        },
        5.8
      );
      tl.fromTo(
        "#b119-hh-unit",
        { opacity: 0, x: -12 },
        { opacity: 0.78, x: 0, duration: 0.6, ease: "power2.out" },
        7.5
      );

      // ---- 8.15s : the quiet attribution line settles under both ----
      tl.fromTo(
        "#b119-note",
        { opacity: 0, y: 10 },
        { opacity: 0.62, y: 0, duration: 0.8, ease: "power2.out" },
        8.15
      );

      // ---- hold to 10.68s, no exit tween ----
      tl.to({}, { duration: 0.01 }, 10.67);

      window.__timelines["119-beat"] = tl;
    })();
  </script>
