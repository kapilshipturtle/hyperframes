  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var figLeft = document.getElementById("b124-fig-left");
      var figRight = document.getElementById("b124-fig-right");

      var LEFT_START = 11.4, LEFT_END = 16.8, RIGHT_VALUE = 11.4;

      function setFig(el, v) { el.textContent = v.toFixed(1); }
      setFig(figLeft, LEFT_START);
      setFig(figRight, RIGHT_VALUE);

      // 0.0-0.9s — eyebrow settles in.
      tl.fromTo("#b124-eyebrow",
        { opacity: 0, y: -14 },
        { opacity: 0.58, y: 0, duration: 0.7, ease: "power2.out" }, 0.15);

      // 0.5-1.5s — LEFT card ("your supply rate") arrives first.
      tl.fromTo("#b124-card-left",
        { opacity: 0, x: -46 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.5);

      // 1.5-2.3s — the divider draws down between them.
      tl.fromTo("#b124-divider",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.75, ease: "power2.inOut" }, 1.5);

      // 1.9-2.9s — RIGHT card ("utility default") arrives second, mirrored.
      tl.fromTo("#b124-card-right",
        { opacity: 0, x: 46 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 1.9);

      // 3.5-5.0s — the left figure ticks visibly HIGHER than the right,
      // which holds still. This is the beat's hinge: "if yours is higher".
      // Seek-safe count-up: the renderer seeks frame-by-frame rather than
      // playing, so an onUpdate driven straight off a timeline tween can be
      // skipped entirely on a cold seek and freeze at its start value.
      // Driving the value off a nested paused tween's OWN progress makes the
      // displayed figure a pure function of timeline position.
      var counter = { v: LEFT_START };
      var counterTween = gsap.to(counter, {
        v: LEFT_END,
        duration: 1.5,
        ease: "power1.inOut",
        paused: true
      });
      tl.to(counterTween, {
        progress: 1,
        duration: 1.5,
        ease: "none",
        onUpdate: function () { setFig(figLeft, counter.v); }
      }, 3.5);
      tl.fromTo("#b124-fig-left",
        { scale: 1 },
        { scale: 1.055, duration: 1.5, ease: "power1.inOut", transformOrigin: "0% 100%" }, 3.5);

      tl.fromTo("#b124-bracket-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.85, ease: "power2.out" }, 5.2);
      tl.to(["#b124-tick-l", "#b124-tick-r"],
        { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.85);

      // Hold to 8.28 — no exit tween; the root transition handles the cut.
      tl.set({}, {}, 8.28);

      window.__timelines["124-beat"] = tl;
    })();
