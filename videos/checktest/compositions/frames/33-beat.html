<template>
  <style>
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .broll-wrap {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
    }
    .broll-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* profile additions: blurred pillarbox for portrait/square media, B&W treatment */
    .broll-pb-bg { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; filter: blur(36px) brightness(0.55) saturate(1.1); }
    .broll-pb-fg { position: absolute; inset: 0; object-fit: contain; }
    .broll-bw { filter: grayscale(1) contrast(1.08); }
    /* comparison grid: 2-4 tiles with labels; a hairline gap, dark ground */
    .broll-grid { position: absolute; inset: 0; display: grid; gap: 6px; background: #0b0b0b; padding: 0; }
    .broll-grid-columns.broll-grid-n2 { grid-template-columns: 1fr 1fr; }
    .broll-grid-columns.broll-grid-n3 { grid-template-columns: 1fr 1fr 1fr; }
    .broll-grid-columns.broll-grid-n4 { grid-template-columns: repeat(4, 1fr); }
    .broll-grid-2x2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .broll-grid-tile { position: relative; overflow: hidden; opacity: 0; }
    .broll-grid-media { width: 100%; height: 100%; object-fit: cover; display: block; }
    .broll-grid-label { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); font: 800 44px/1.1 "Inter", -apple-system, sans-serif; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.7); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; background: rgba(0,0,0,0.55); padding: 0.25em 0.6em; border-radius: 6px; opacity: 0; }
    .broll-split-a, .broll-split-b { position: absolute; object-fit: cover; }
    .broll-split-a.broll-split-left-right { left: 0; top: 0; width: 50%; height: 100%; }
    .broll-split-b.broll-split-left-right { left: 50%; top: 0; width: 50%; height: 100%; border-left: 4px solid rgba(255,255,255,0.9); box-sizing: border-box; }
    .broll-split-a.broll-split-top-bottom { left: 0; top: 0; width: 100%; height: 50%; }
    .broll-split-b.broll-split-top-bottom { left: 0; top: 50%; width: 100%; height: 50%; border-top: 4px solid rgba(255,255,255,0.9); box-sizing: border-box; }
    /* Cutaway sits absolutely over the primary media inside the same wrap
       (so it inherits the same Ken Burns move on the wrap element, keeping
       the two shots visually consistent) — starts transparent, GSAP
       crossfades it in at --cutaway-at, see the script block below. */
    .broll-cutaway {
      position: absolute;
      inset: 0;
    }
    /* 2.5D parallax layers (see gen-depth-layers.py) — both stacked full-
       bleed inside the same wrap. The foreground is deliberately oversized
       (rather than 100%) so its own independent translate (see parallaxCode
       below) never slides a transparent edge into frame — the same
       overscan-margin idea the wrap itself already uses, just at the layer
       level since the fg moves MORE than the wrap's own Ken Burns alone. */
    .broll-parallax-bg {
      position: absolute;
      inset: 0;
      object-fit: cover;
    }
    .broll-parallax-fg {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      object-fit: contain;
      object-position: center;
    }
    /* subtle bottom scrim so any burned-in captions stay readable over bright footage */
    .broll-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%);
      pointer-events: none;
    }
    /* Optional per-beat vignette — a real, if modest, "composited" texture
       layer distinct from the global grain overlay (which is flat, uniform,
       full-timeline). Researched documentary/explainer-channel convention:
       supporting texture layers COMPOSITED WITH the base clip, in the same
       frame, is the single highest-leverage visual-quality delta over "one
       flat clip per beat" — this is the smallest, most self-contained piece
       of that: a soft radial darkening toward the frame edges, drawing the
       eye toward center/subject the way a real lens vignette does. Opt-in
       per beat via --vignette, never global/automatic (unlike grain) since
       its strength should vary by shot mood, not apply uniformly.*/
    .broll-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    .ov-ec-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; }
    .ov-ec { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; max-width: 78%; }
    .ov-ec-text { display: block; font: 700 52px/1.2 -apple-system, "Inter", sans-serif; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.4); }
    .ov-ec-cta { display: block; margin-top: 20px; font: 500 24px/1.4 -apple-system, "Inter", sans-serif; color: rgba(255,255,255,0.8); text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.4); opacity: 0; }
  </style>

  <div
    id="root"
    data-composition-id="33-beat"
    data-width="1920" data-height="1080" data-duration="4.00"
  >
    <div class="broll-wrap" id="f-33-beat-wrap">
      <video id="f-33-beat-media" class="broll-media clip" src=".media/broll/beat-33.mp4" muted playsinline data-start="0" data-duration="4.00" data-media-start="0" data-track-index="0"></video>
      <img id="f-33-beat-cutaway" class="broll-media broll-cutaway clip" src=".hyperframes/freeze/33-beat-freeze.jpg" data-start="1.00" data-duration="3.00" data-track-index="4" style="opacity:0;" />
    </div>
    <div class="broll-scrim clip" id="f-33-beat-scrim" data-start="0" data-duration="4.00" data-track-index="1"></div>
    <div class="broll-vignette clip" id="f-33-beat-vignette" data-start="0" data-duration="4.00" data-track-index="3"></div>
    <div class="ov-ec-scrim" id="f-33-beat-ov-scrim"></div><div class="ov-ec" id="f-33-beat-ov"><span class="ov-ec-text" id="f-33-beat-ov-text">Three deductions. One number. Check yours.</span></div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var wrap = document.getElementById("f-33-beat-wrap");
      gsap.set(wrap, { scale: 1.0 });
      tl.to("#f-33-beat-ov-scrim", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.50);
      tl.to("#f-33-beat-ov", { opacity: 1, duration: 0.01 }, 1.50);
      tl.fromTo("#f-33-beat-ov-text", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.70);
      // Quick crossfade hand-off to the cutaway layer — primary media fades
      // out just as the cutaway fades in, both centered on --cutaway-at, so
      // there's never a moment either layer reads as a hard pop.
      var cutawayEl = document.getElementById("f-33-beat-cutaway");
      var primaryEl = document.getElementById("f-33-beat-media");

      // freeze-frame: the still simply covers the still-playing primary from --freeze-at on (no fade on the clip element — the framework owns its visibility)
      tl.set(cutawayEl, { opacity: 1 }, 1.00);
      window.__timelines["33-beat"] = tl;
    })();
  </script>
</template>
