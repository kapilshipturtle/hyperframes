  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bar = document.getElementById("beat00bn-bar");
      var live = document.getElementById("beat00bn-live");
      var liveDot = document.getElementById("beat00bn-live-dot");
      var ticker = document.getElementById("beat00bn-ticker");

      // Breaking-news bar slides in from the left within the first ~0.8s and holds.
      tl.to(bar, { x: "0%", duration: 0.8, ease: "power3.out" }, 0.15);

      // LIVE indicator fades in shortly after the bar starts moving.
      tl.to(live, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.4);

      // Deterministic sine-based pulse for the LIVE dot via GSAP onUpdate — no CSS
      // @keyframes, no Math.random(). Runs across the remaining duration so it is
      // still pulsing at the end of the clip.
      var pulseState = { t: 0 };
      tl.to(pulseState, {
        t: Math.PI * 2 * 3.5, // ~3.5 pulse cycles across the beat
        duration: 2.6,
        ease: "none",
        onUpdate: function () {
          var s = (Math.sin(pulseState.t) + 1) / 2; // 0..1
          var scale = 0.85 + s * 0.3;
          var opacity = 0.55 + s * 0.45;
          gsap.set(liveDot, { scale: scale, opacity: opacity });
        }
      }, 0.4);

      // Continuous right-to-left ticker crawl, scrolling by the end of the beat.
      // Track content is duplicated in the markup so the loop-point (at -50%)
      // reads seamlessly; deterministic linear tween, no repeat:-1 (renderer
      // seeks frame-by-frame so a single finite tween across full duration
      // keeps it seek-safe).
      tl.fromTo(ticker,
        { x: "0%" },
        { x: "-50%", duration: 3.0, ease: "none" },
        0
      );

      window.__timelines["00-beat"] = tl;
    })();
