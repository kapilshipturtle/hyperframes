<template>

      position: absolute;
      inset: 0;
      background: linear-gradient(

        #2b241d 0%,
        #241f1c 28%,
        #17151a 60%,
        #0e0d10 100%

    .beat06-horizon {

    /* Single stage layer carrying the crate + seam + spill + shadow group,

    .beat06-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 620px;
      height: 500px;

    .beat06-ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 620px;
      height: 60px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 75%);

    .beat06-crate {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 480px;

      transform: translateX(-50%);
      background: #0b0a0c;
      border: 2px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);

    /* Subtle crate slat lines — quiet texture, not a literal illustration. */
    .beat06-crate::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .beat06-crate::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 18px;
      bottom: 18px;

      background: rgba(255, 255, 255, 0.03);

       widens into a wedge of light as the door swings open. Anchored to the
       crate's left edge, growing rightward. Interior stays pure black — no
       animal shape is ever drawn; the reveal belongs to beat 07. */
    .beat06-seam-wrap {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 480px;
      height: 340px;
      transform: translateX(-50%);
      overflow: hidden;

      left: 0;
      top: 0;

    .beat06-interior {
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 0px;
      background: #000;

    .beat06-spill {

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var horizon = document.getElementById("beat06-horizon");
      var interior = document.getElementById("beat06-interior");
      var seamGlow = document.getElementById("beat06-seam-glow");
      var spill = document.getElementById("beat06-spill");
      var groundShadow = document.getElementById("beat06-ground-shadow");

      // Establish resting state at t=0: seam is a hairline, interior closed,
      // no spill yet, ground shadow tight under the closed crate.
      gsap.set(horizon, { opacity: 0.7 });
      gsap.set(interior, { width: 0 });
      gsap.set(seamGlow, { opacity: 0.6 });
      gsap.set(spill, { opacity: 0, scaleY: 0.6, transformOrigin: "top center" });
      gsap.set(groundShadow, { scaleX: 1 });

      // Slow dawn-light breathing on the horizon glow across the whole
      // duration — quiet ambience, not the main event.
      tl.to(horizon, { opacity: 1, duration: 9.22, ease: "sine.inOut" }, 0);

      // The held-breath opening: the seam widens gradually across most of
      // the duration (roughly 15% -> 92%), never popping open instantly.
      // Interior stays solid black the entire time — no animal silhouette
      // is ever drawn; only a widening dark gap + a spilling wedge of light.
      tl.to(interior, {
        width: 210,
        duration: 6.9,
        ease: "power1.inOut"
      }, 1.4);

      tl.to(seamGlow, {
        x: 210,
        duration: 6.9,
        ease: "power1.inOut"
      }, 1.4);

      // The ground-spill light only becomes visible once the door has
      // opened enough to plausibly cast light outward (starts ~55% in),
      // growing gently through to the end.
      tl.to(spill, {
        opacity: 1,
        scaleY: 1,
        duration: 3.4,
        ease: "sine.out"
      }, 5.1);

      // Ground shadow widens very slightly as the door opens, following the
      // added light spill.
      tl.to(groundShadow, {
        scaleX: 1.25,
        duration: 3.6,
        ease: "sine.out"
      }, 5.4);

      window.__timelines["06-beat"] = tl;
    })();
  </script>
